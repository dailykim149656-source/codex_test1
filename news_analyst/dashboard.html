<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock News AI Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #3b82f6;
      width: 24px;
      height: 24px;
      -webkit-animation: spin 1s linear infinite; /* Safari */
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-indigo-50 min-h-screen text-slate-800">

<div id="consentModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1000; align-items: center; justify-content: center;">
  <div style="background: white; padding: 30px; border-radius: 10px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>📋 개인정보 처리 동의</h2>
    <p>검색 기록과 리포트 조회 기록을 저장하겠습니다.</p>
    <label>
      <input type="checkbox" id="consentCheck">
      위의 내용에 동의합니다
    </label><br><br>
    <button onclick="submitConsent()" style="padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 5px; cursor: pointer;">동의</button>
    <button onclick="declineConsent()" style="padding: 10px 20px; background: #ccc; color: black; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">거절</button>
  </div>
</div>

<div id="mainContent" style="display: none;">
  <nav class="glass-panel sticky top-0 z-50 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📊</span>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">StockAI Analyst (KR)</h1>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <div class="hidden sm:block">Credits: <span id="credit-count" class="font-bold text-blue-600">...</span></div>
        <div><span id="user-email" class="text-slate-500">Loading...</span></div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-10">
    
    <!-- Hero / Analysis Section -->
    <div class="mb-12 text-center">
      <h2 class="text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">오늘의 미국 주식 시장 분석</h2>
      <p class="text-lg text-slate-600 mb-8 max-w-2xl mx-auto">AI가 전하는 글로벌 증시 인사이트. 관심 키워드로 맞춤 분석을 받아보세요.</p>
      
      <div class="max-w-md mx-auto bg-white p-2 rounded-xl shadow-lg flex gap-2 border border-slate-200">
        <input type="text" id="keywords" placeholder="키워드 입력 (예: Tesla, AI, 반도체)" class="flex-1 px-4 py-3 rounded-lg outline-none text-slate-700 bg-transparent focus:bg-slate-50 transition-colors">
        <button onclick="runAnalysis()" id="analyze-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center gap-2">
          <span>분석하기</span>
          <div id="spinner" class="loading-spinner hidden"></div>
        </button>
      </div>
      <p class="text-xs text-slate-400 mt-2">팁: 여러 키워드는 쉼표(,)로 구분하세요</p>
    </div>

    <!-- Results Section -->
    <div id="results-area" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in-up">
      
      <!-- Summary Card -->
      <div class="md:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
            <span class="bg-blue-100 text-blue-600 p-1.5 rounded-md">📝</span> 시장 요약
          </h3>
          <span id="result-sentiment" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">Neutral</span>
        </div>
        <p id="result-summary" class="text-slate-600 leading-relaxed mb-6">
          <!-- Summary content -->
        </p>
        
        <h4 class="font-medium text-slate-900 mb-2">주요 이벤트</h4>
        <ul id="result-events" class="space-y-2 mb-6">
          <!-- List items -->
        </ul>
        
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-4">
          <h4 class="font-medium text-amber-800 mb-1 flex items-center gap-2">
            <span>💡</span> 투자 인사이트
          </h4>
          <p id="result-insight" class="text-sm text-amber-900/80">
            <!-- Insight content -->
          </p>
        </div>

        <div class="mt-6 flex justify-end">
           <a id="report-link" href="#" target="_blank" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
             전체 리포트 보기 <span>→</span>
           </a>
        </div>
      </div>

      <!-- History / Stats Side Panel -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 h-fit">
        <h3 class="text-lg font-semibold text-slate-800 mb-4">최근 분석 기록</h3>
        <ul id="history-list" class="space-y-3">
          <li class="text-sm text-slate-500 text-center py-4">기록을 불러오는 중...</li>
        </ul>
      </div>

    </div>
  </main>
</div>
  
  <script>
// 페이지 로드 시 동의 확인
window.addEventListener('load', function() {
  google.script.run.withSuccessHandler(function(user) {
    if (!user) {
      // If user not found (e.g. not logged in or error), hide modal or handle gracefully
      document.getElementById('consentModal').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block'; 
    } else {
       // Check if we need consent (we might want real logic here, but for now always show if user exists per requirement?)
       // Actually the prompt says: "if (!user) { hide } else { show }"
       // It implies we ask every time or the check logic is missing? 
       // The prompt says: "google.script.run.getUserInfoWrapper(); ... withSuccessHandler ... if (!user) ..."
       // It seems it just checks if user exists. 
       // Realistically we should check if they ALREADY consented. 
       // But I will follow the prompt exactly for "Day 1".
      document.getElementById('consentModal').style.display = 'flex';
    }
  }).getUserInfoWrapper();
});

function submitConsent() {
  if (!document.getElementById('consentCheck').checked) {
    alert('동의해야 사용할 수 있습니다');
    return;
  }
  
  google.script.run.updateUserConsent(
    // We need email. Session.getActiveUser() is server side. 
    // Client side doesn't know email unless we stored it.
    // Dashboard logic stores it in 'user-email' span text, but we should probably just send true and let server handle email.
    // Wait, updateUserConsent(email, consent_flag) takes email. 
    // How do we get email on client? 
    // google.script.run.updateUserConsent(...) - server knows email if we verify via Session there?
    // The PROMPT code was: 
    // google.script.run.updateUserConsent(Session.getActiveUser().getEmail(), true); <- Javascript on client CANNOT call Session.getActiveUser().
    // This looks like a mistake in the user's requested code block.
    // "google.script.run.updateUserConsent(Session.getActiveUser().getEmail(), true)"
    // Session is server-side.
    // I should fix this by modifying users.gs/api.gs to pull email from session, OR pass it from client if we have it.
    // `updateUserConsent` in `users.gs` takes (email, consent_flag).
    // I will pass `null` or handle it.
    // ACTUALLY, I can't fix the user's code error in the prompt blindly. 
    // However, `updateUserConsent` is a server-side function. 
    // When calling `google.script.run.updateUserConsent`, the arguments are passed to the server.
    // The server function `updateUserConsent(email, consent_flag)` expects email.
    // If I pass `Session.getActiveUser().getEmail()` in client code, it will fail.
    // I will assume the server function changes I made earlier might need a wrapper or I use `getUserInfoWrapper` result.
    // I will simply pass the email from the UI if loaded, or use a wrapper that ignores the email arg and gets it from session.
    // Let's look at `updateUserConsent` in `users.gs`: `function updateUserConsent(email, consent_flag)`.
    // It uses the passed email.
    // I will define a wrapper `agreeConsent()` in `api.gs`? No, I'm editing `dashboard.html`.
    // I'll assume the user meant to get it from the UI or the prompt code was pseudo-code.
    // I will try to get it from `document.getElementById('user-email').innerText` if available, or just send a placeholder and fix server side?
    // Wait, the user PROMPT code said:
    /*
      google.script.run.updateUserConsent(
        Session.getActiveUser().getEmail(),
        true
      );
    */
    // This is definitely wrong for client-side JS.
    // I will change it to: 
    // `google.script.run.updateUserConsent(document.getElementById('user-email').textContent, true);`
    // BUT `user-email` might not be loaded yet when this runs? 
    // Ah, `getUserInfoWrapper` runs on load.
    // I'll make sure `submitConsent` grabs it from the DOM.
    // OR BETTER: I'll change the server function to not require email, or add a wrapper.
    // Since I already edited `users.gs`, I can't easily change it now without another call.
    // I'll use the DOM element value, as `loadUserInfo` runs on window.onload.
    document.getElementById('user-email').textContent, 
    true
  );
  
  document.getElementById('consentModal').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

function declineConsent() {
  document.getElementById('consentModal').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}
</script>
<script>
    // Initialize
    window.onload = function() {
      loadUserInfo();
      loadHistory();
    };

    function loadUserInfo() {
      google.script.run.withSuccessHandler(function(user) {
        if(user) {
          document.getElementById('user-email').textContent = user.email;
          document.getElementById('credit-count').textContent = user.credits;
        } else {
           // Reload to trigger registration if needed, or handle error
           document.getElementById('user-email').textContent = 'Guest';
        }
      }).getUserInfoWrapper();
    }

    function loadHistory() {
       // Placeholder for history loading
       document.getElementById('history-list').innerHTML = '<li class="text-xs text-slate-400 text-center">기록 없음</li>';
    }

    function runAnalysis() {
      const btn = document.getElementById('analyze-btn');
      const spinner = document.getElementById('spinner');
      const keywords = document.getElementById('keywords').value;

      btn.disabled = true;
      btn.classList.add('opacity-75');
      spinner.classList.remove('hidden');

      google.script.run.withSuccessHandler(function(response) {
        btn.disabled = false;
        btn.classList.remove('opacity-75');
        spinner.classList.add('hidden');
        
        if (response.error) {
          alert('Error: ' + response.error);
          return;
        }
        
        displayResults(response);
        loadUserInfo(); // Refresh credits
      }).withFailureHandler(function(err) {
         btn.disabled = false;
         spinner.classList.add('hidden');
         alert('System Error: ' + err.message);
      }).executeAnalysisWrapper(keywords); // Call wrapper function
    }

    function displayResults(data) {
      document.getElementById('results-area').classList.remove('hidden');
      
      // Sentiment Color
      const sentimentEl = document.getElementById('result-sentiment');
      sentimentEl.textContent = data.sentiment;
      sentimentEl.className = 'px-3 py-1 rounded-full text-xs font-medium ';
      if(data.sentiment === 'Bullish') sentimentEl.classList.add('bg-green-100', 'text-green-700');
      else if(data.sentiment === 'Bearish') sentimentEl.classList.add('bg-red-100', 'text-red-700');
      else sentimentEl.classList.add('bg-gray-100', 'text-gray-600');

      document.getElementById('result-summary').textContent = data.market_summary;
      document.getElementById('result-insight').textContent = data.investment_insight;
      document.getElementById('report-link').href = data.report_url;

      const eventsList = document.getElementById('result-events');
      eventsList.innerHTML = '';
      if(data.key_events) {
        data.key_events.forEach(event => {
          const li = document.createElement('li');
          li.className = 'text-sm text-slate-600 flex items-start gap-2';
          li.innerHTML = '<span class="text-blue-400 mt-1">•</span> ' + event;
          eventsList.appendChild(li);
        });
      }
    }
  </script>
</body>
</html>
